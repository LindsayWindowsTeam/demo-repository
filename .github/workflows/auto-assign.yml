name: Auto Assign
on:
  issues:
    types: [opened]
  pull_request:
    types: [opened]
jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
    # pozil/auto-assign-issue@v1 reads only github.event.issue and throws on
    # pull_request events. Issues and PRs share the issues assignees API.
    - name: 'Auto-assign issue or PR'
      uses: actions/github-script@v7
      with:
        script: |
          const item = context.payload.issue || context.payload.pull_request;
          await github.rest.issues.addAssignees({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: item.number,
            assignees: ['peytondsay'],
          });
